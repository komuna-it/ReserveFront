name: Build and Deploy Angular

on:
  push:
    tags:
      - '*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v2

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_CONTENT" > .env

      - name: Build Angular App
        run: npm run build -- --configuration production

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_AWS_LMT }}

      - name: Add Host to Known Hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT_AWS_LMT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Build via Rsync and Update Symlink
        run: |
          VERSION=${{ steps.gitversion.outputs.fullSemVer }}
          WORK_DIR="${{ secrets.WORK_DIR }}"

          ssh ${{ secrets.SSH_USER_AWS_LMT }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT_AWS_LMT }} "mkdir -p '$WORK_DIR/$VERSION'"

          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT_AWS_LMT }}" dist/vipsoundfront/browser/ ${{ secrets.SSH_USER_AWS_LMT }}@${{ secrets.SSH_HOST }}:$WORK_DIR/$VERSION/

          ssh ${{ secrets.SSH_USER_AWS_LMT }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT_AWS_LMT }} "cd $WORK_DIR && ln -sfn '$VERSION' latest"
