name: Build and Deploy Angular

on:
  push:
    tags:
      - '*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v2

      - name: Install Dependencies
        run: npm ci

      - name: Create .env locally
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_CONTENT" > .env

      - name: Build Angular App
        run: npm run build -- --configuration production

      - name: Show build output
        run: ls -R dist/

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_BETA  }}

      - name: Add Host to Known Hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT_BETA }} -H ${{ secrets.SSH_HOST }}  >> ~/.ssh/known_hosts

      - name: Upload Build via Rsync
        run: |
          VERSION=${{ steps.gitversion.outputs.fullSemVer }}
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT_BETA }} "
            mkdir -p '${{ secrets.WORK_DIR }}/$VERSION';
            if [ -L '${{ secrets.WORK_DIR }}/latest' ]; then
              unlink '${{ secrets.WORK_DIR }}/latest';
            fi
            ln -s '$VERSION' '${{ secrets.WORK_DIR }}/latest'
          "
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT_BETA }}" dist/vipsoundfront/browser/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR }}/$VERSION/

      - name: Restart Web Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT_BETA }} \
            "sudo systemctl reload nginx"

      - name: Cleanup
        run: rm -rf ~/.ssh
