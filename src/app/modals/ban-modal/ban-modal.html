<div
  class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50"
>
  <div
    class="bg-slate-800 text-slate-100 p-6 rounded-2xl shadow-2xl border border-emerald-500/50 text-center max-w-xs w-full flex flex-col items-center"
  >
    <div
      class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mb-3 border border-emerald-500/30"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
    </div>
    <h2 class="text-lg font-bold tracking-tight mb-1 text-slate-100">
      {{ 'USER_MODALS.CONFIRM_BAN_TITLE' | transloco }}
    </h2>
    <span class="text-xs text-slate-400 mb-5">
      {{ 'USER_MODALS.CONFIRM_BAN_BODY' | transloco }}
    </span>

    @for (user of users; track user.id) {
      <div
        class="space-y-2 text-sm text-slate-300 mb-6 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50"
      >
        <p>
          <strong>{{ 'USERS_TABLE.NICK' | transloco }}:</strong> {{ user.nick }}
        </p>
        <p>
          <strong>{{ 'USERS_TABLE.REASON' | transloco }}:</strong>
          <input
            type="text"
            [ngModel]="reason"
            class="w-full bg-slate-700 text-white font-medium border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
            required
          />
        </p>
        <p>
          <strong>{{ 'USERS_TABLE.DURATION' | transloco }}:</strong>
          <input
            type="text"
            [ngModel]="durationInput"
            class="w-full bg-slate-700 text-white font-medium border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
            required
          />
        </p>
      </div>
    }

    <button
      (click)="handleBan()"
      class="w-full px-4 py-2 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-md"
    >
      {{ 'USER_MODALS.CONFIRM' | transloco }}
    </button>

    <button
      (click)="facade.closeModals()"
      class="w-full px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-white transition-all shadow-md mt-2"
    >
      {{ 'USER_MODALS.CANCEL' | transloco }}
    </button>
  </div>
</div>
