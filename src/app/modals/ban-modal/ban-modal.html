<div
  class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50"
  (click)="facade.closeModals()"
>
  <div
    (click)="$event.stopPropagation()"
    class="border border-red-500 border-2 bg-slate-800 text-slate-100 p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full flex flex-col items-center"
  >
    <h2 class="text-lg font-bold tracking-tight mb-1 text-slate-100">
      {{ 'USER_MODALS.CONFIRM_BAN_TITLE' | transloco }}
    </h2>

    <div class="w-full max-h-36 overflow-y-auto space-y-2 mb-4 text-left">
      @for (user of users; track user.id) {
        <div
          class="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 flex flex-col gap-1"
        >
          <p>
            <strong class="text-slate-400">{{ 'USERS_TABLE.NICK' | transloco }}:</strong>
            {{ user.nick }}
          </p>
          <p>
            <strong class="text-slate-400">{{ 'USERS_TABLE.EMAIL' | transloco }}:</strong>
            {{ user.email }}
          </p>
        </div>
      }
    </div>

    <div class="w-full space-y-3 text-left mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">
          {{ 'USERS_TABLE.REASON' | transloco }}
        </label>
        <input
          type="text"
          [(ngModel)]="reason"
          placeholder=" {{ 'USERS_TABLE.REASON' | transloco }}..."
          class="w-full bg-slate-700 text-white text-xs border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          required
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">
          {{ 'USERS_TABLE.DURATION' | transloco }} {{ 'USERS_TABLE.IN_DAYS' | transloco }}
        </label>
        <input
          type="number"
          oninput="if (this.value.length > 4) this.value = this.value.slice(0, 4);"
          [(ngModel)]="durationInput"
          placeholder="7"
          class="w-full bg-slate-700 text-white text-xs border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          required
        />
      </div>
    </div>

    <div class="flex justify-between w-full">
      <button
        (click)="facade.closeModals()"
        class="w-[45%] px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-white transition-all shadow-md"
      >
        {{ 'USER_MODALS.CANCEL' | transloco }}
      </button>
      <button
        (click)="handleBan()"
        [disabled]="!reason || !durationInput"
        class="w-[45%] px-4 py-3 text-xs font-semibold rounded-lg bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-all shadow-md"
      >
        {{ 'USER_MODALS.CONFIRM' | transloco }}
      </button>
    </div>
  </div>
</div>
