<div
  class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50"
>
  <div
    class="bg-slate-800 text-slate-100 p-6 rounded-2xl shadow-2xl border border-red-500/50 text-center max-w-xs w-full flex flex-col items-center"
  >
    <div
      class="w-12 h-12 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mb-3 border border-red-500/30"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </div>
    <h2 class="text-lg font-bold tracking-tight mb-1 text-slate-100">
      {{ titleText() }}
    </h2>
    <span class="text-xs text-slate-400 mb-5">
      {{ bodyText() }}
    </span>

    <button
      (click)="facade.closeModals()"
      class="w-full px-4 py-2 text-xs font-semibold rounded-lg bg-red-600 hover:bg-red-500 text-white transition-all shadow-md"
    >
      {{ 'USER_MODALS.CONFIRM' | transloco }}
    </button>
  </div>
</div>
