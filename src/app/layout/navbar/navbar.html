<nav
  class="sticky top-0 z-50 w-full bg-slate-950/80 backdrop-blur-md border-b border-slate-800 transition-all"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex-shrink-0 flex items-center">
        <a routerLink="/" class="flex items-center gap-3 group" (click)="closeMobileMenu()">
          <img
            src="assets/images/logo_scale.jfif"
            alt="VipSound Logo"
            class="h-10 rounded-xl object-cover shadow-lg group-hover:border-blue-500 transition-colors"
          />
        </a>
      </div>

      <div class="hidden md:flex items-center space-x-6">
        <a
          routerLink="/calendar"
          routerLinkActive="text-blue-400"
          class="text-sm font-medium text-slate-300 hover:text-white transition-colors"
        >
          Zarezerwuj
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-blue-400"
          class="text-sm font-medium text-slate-300 hover:text-white transition-colors"
        >
          Kontakt
        </a>

        <div class="h-6 w-px bg-slate-700 mx-2"></div>

        @if (!authService.isAuthenticated()) {
          <a
            routerLink="/login"
            class="text-sm font-medium text-slate-300 hover:text-white transition-colors"
          >
            Logowanie
          </a>
          <a
            routerLink="/register"
            class="text-sm font-medium px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 shadow-lg shadow-blue-500/20 transition-all active:scale-95"
          >
            Zarejestruj się
          </a>
        } @else {
          <a
            routerLink="/profile"
            class="text-sm font-medium px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 border border-slate-700 transition-all"
          >
            Mój profil
          </a>
          <button
            (click)="logout()"
            class="text-sm font-medium px-4 py-2 text-slate-300 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-all"
          >
            Wyloguj
          </button>
        }
      </div>

      <div class="md:hidden flex items-center">
        <button
          (click)="toggleMobileMenu()"
          class="p-2 text-slate-400 hover:text-white focus:outline-none"
        >
          @if (!isMobileMenuOpen()) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-800 bg-slate-900 shadow-xl">
      <div class="px-4 pt-2 pb-6 space-y-2 flex flex-col">
        <a
          routerLink="/calendar"
          (click)="closeMobileMenu()"
          class="block px-3 py-3 text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
        >
          Rezerwacje
        </a>
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          class="block px-3 py-3 text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
        >
          Kontakt
        </a>

        <div class="h-px bg-slate-800 my-2"></div>

        @if (!authService.isAuthenticated()) {
          <a
            routerLink="/login"
            (click)="closeMobileMenu()"
            class="block px-3 py-3 text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >
            Logowanie
          </a>
          <a
            routerLink="/register"
            (click)="closeMobileMenu()"
            class="block px-3 py-3 mt-2 text-base font-medium text-center text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-md"
          >
            Zarejestruj się
          </a>
        } @else {
          <a
            routerLink="/profile"
            (click)="closeMobileMenu()"
            class="block px-3 py-3 text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >
            Mój profil
          </a>
          <button
            (click)="logout()"
            class="w-full text-left block px-3 py-3 text-base font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg"
          >
            Wyloguj
          </button>
        }
      </div>
    </div>
  }
</nav>
