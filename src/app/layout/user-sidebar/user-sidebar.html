<!-- Mobile Top Bar -->
<div
  class="md:hidden flex items-center justify-between p-4 bg-slate-800/90 border-b border-slate-700/80 text-white"
>
  <h1 class="text-base font-bold uppercase tracking-wider">Profil</h1>
  <button
    (click)="toggleMobileMenu()"
    type="button"
    class="p-2 text-slate-400 hover:text-white hover:bg-slate-700/60 rounded-xl transition-colors"
    aria-label="Toggle Menu"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      @if (isMobileMenuOpen()) {
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      } @else {
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      }
    </svg>
  </button>
</div>

<!-- Sidebar Navigation -->
<aside
  [class.hidden]="!isMobileMenuOpen()"
  class="md:flex w-full md:w-64 bg-slate-800/90 border-r border-slate-700/80 p-5 flex-col shrink-0 backdrop-blur-md space-y-6"
>
  <div class="hidden md:block">
    <div class="px-3 py-2 bg-slate-900/60 rounded-xl border border-slate-700/50 text-center">
      <h1 class="text-lg font-bold text-white tracking-wider uppercase">Profil</h1>
    </div>
  </div>

  <!-- User Info Badge -->
  <div
    class="flex items-center gap-3 bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60 text-xs font-mono"
  >
    <div class="flex flex-col gap-1 min-w-0 w-full">
      <strong class="text-slate-200 truncate text-sm">
        @if (authService.currentUser(); as user) {
          Witaj, {{ user.nick }}
        }
      </strong>

      <span class="text-slate-400 truncate">
        Email:
        <strong class="text-slate-200 truncate block">{{
          authService.email() || ('PROFILE.UNAUTHENTICATED' | transloco)
        }}</strong>
      </span>
      <span class="text-slate-400">
        Rola:
        <strong class="text-emerald-400">{{ authService.isAdmin() ? 'ADMIN' : 'USER' }}</strong>
      </span>
    </div>
  </div>

  <nav class="space-y-1.5 font-medium text-sm">
    <!-- Reservations -->
    <div class="space-y-1">
      <a
        routerLink="/profile/reservations"
        routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
      >
        <svg
          class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          ></path>
        </svg>
        Rezerwacje
      </a>
    </div>

    <!-- Teams / Organizations -->
    <div class="space-y-1">
      <a
        routerLink="/profile/organizations"
        routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
      >
        <svg
          class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          ></path>
        </svg>
        Zespoły
      </a>
    </div>
  </nav>
</aside>
