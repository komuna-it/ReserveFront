<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
  <div class="w-96 bg-slate-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">{{ 'NAVBAR.REGISTER' | transloco }}</h1>

    <form (ngSubmit)="register()" class="space-y-4" autocomplete="on">
      <!-- Username / Nick -->
      <div>
        <label for="username" class="block">{{ 'USERS_TABLE.NICK' | transloco }}</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="name"
          name="username"
          autocomplete="username"
          class="w-full p-2 rounded text-white border border-slate-700"
          required
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-1">{{ 'USERS_TABLE.EMAIL' | transloco }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          class="w-full p-2 rounded text-white border border-slate-700"
          required
        />
      </div>

      <!-- Password -->
      <div>
        <label for="new-password" class="block mb-1">{{ 'BUTTONS.PASSWORD' | transloco }}</label>
        <input
          id="new-password"
          type="password"
          [(ngModel)]="password"
          name="new-password"
          autocomplete="new-password"
          class="w-full p-2 rounded text-white border border-slate-700"
          required
        />
      </div>

      <!-- Privacy Policy -->
      <div class="flex items-start gap-3 mt-4">
        <input
          id="acceptPrivacyPolicyCheckbox"
          name="policyAccepted"
          type="checkbox"
          [(ngModel)]="policyAccepted"
          required
          class="w-4 h-4 mt-1 text-emerald-600 bg-slate-700 border-slate-600 rounded focus:ring-emerald-500 focus:ring-2 cursor-pointer shrink-0"
        />
        <label
          for="acceptPrivacyPolicyCheckbox"
          class="text-sm font-medium text-slate-300 cursor-pointer select-none"
        >
          {{ 'COMMON.I_ACCEPT_PRIVACY_POLICY' | transloco }}
          <a
            class="text-blue-400 hover:underline ml-1 cursor-pointer"
            (click)="viewPrivacyPolicy($event)"
          >
            {{ 'SETTINGS.VIEW_POLICY' | transloco }}
          </a>
        </label>
      </div>

      <!-- Errors -->
      @if (getFieldErrors('password').length > 0) {
        <div class="mt-1 space-y-1">
          @for (err of getFieldErrors('password'); track err) {
            <p class="text-red-400 text-xs">{{ err }}</p>
          }
        </div>
      }

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="!policyAccepted"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 disabled:cursor-not-allowed p-2 rounded font-bold my-3 transition-colors"
      >
        Register
      </button>

      @if (generalError()) {
        <div class="text-red-500 text-sm mt-1 p-2 bg-red-950/40 border border-red-800 rounded">
          {{ generalError() }}
        </div>
      }
    </form>

    <div class="mt-4">
      <a class="flex justify-center text-gray-200 hover:text-white underline" href="/login">
        {{ 'COMMON.ALREADY_HAVE_ACCOUNT_LOGIN' | transloco }}
      </a>
    </div>
  </div>
</div>
