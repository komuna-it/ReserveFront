<div class="min-h-screen flex flex-col md:flex-row bg-slate-900 text-slate-100">
  <!-- Mobile Top Header with Hamburger Toggle -->
  <header
    class="md:hidden bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between sticky top-0 z-40"
  >
    <span class="font-bold text-lg text-white tracking-wide">Panel Admina</span>
    <button
      (click)="toggleMobileMenu()"
      class="p-2 text-slate-300 hover:text-white rounded-lg hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500"
      aria-label="Toggle navigation menu"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (!isMobileMenuOpen()) {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        } @else {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        }
      </svg>
    </button>
  </header>

  <!-- Sidebar Navigation -->
  <aside
    [class.hidden]="!isMobileMenuOpen()"
    class="md:block w-full md:w-64 bg-slate-800/90 border-r border-slate-700/80 p-5 flex flex-col shrink-0 backdrop-blur-md"
  >
    <div class="hidden md:block mb-8">
      <div class="px-3 py-2 bg-slate-900/60 rounded-xl border border-slate-700/50 text-center">
        <h1 class="text-lg font-bold text-white tracking-wider uppercase">Panel Admina</h1>
      </div>
    </div>

    <nav class="space-y-1.5 font-medium text-sm">
      <!-- reservations -->
      <div class="space-y-1">
        <a
          routerLink="/admin/reservations"
          routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
          class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
        >
          <svg
            class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          Rezerwacje
        </a>

        <!-- Reserv sub-actions Tree -->
        <div class="ml-4 pl-3 border-l-2 border-slate-700/80 space-y-1 pt-1">
          <button
            routerLink="/admin/reservations/calendar"
            routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
            class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/20 transition-all active:scale-95"
          >
            <span class="text-gray-300 text-sm">Kalendarz</span>
          </button>
        </div>

        <!-- Reserv sub-actions Tree -->
        <div class="ml-4 pl-3 border-l-2 border-slate-700/80 space-y-1 pt-1">
          <button
            routerLink="/admin/reservations/confirmed"
            routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
            class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/20 transition-all active:scale-95"
          >
            <span class="text-gray-300 text-sm">Potwierdzone</span>
          </button>
        </div>

        <!-- Reserv sub-actions Tree -->
        <div class="ml-4 pl-3 border-l-2 border-slate-700/80 space-y-1 pt-1">
          <button
            routerLink="/admin/reservations/pending"
            routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
            class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/20 transition-all active:scale-95"
          >
            <span class="text-gray-300 text-sm">Do potwierdzenia</span>
          </button>
        </div>
      </div>

      <!-- Reserv sub-actions Tree -->
      <div class="ml-4 pl-3 border-l-2 border-slate-700/80 space-y-1 pt-1">
        <button
          routerLink="/admin/reservations/cancelled"
          routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
          class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/20 transition-all active:scale-95"
        >
          <span class="text-gray-300 text-sm">Do odwołania</span>
        </button>
      </div>

      <!-- pricing -->
      <a
        routerLink="/admin/pricing"
        routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
      >
        <svg
          class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        Cennik
      </a>

      <!-- orgs -->
      <div class="space-y-1">
        <a
          routerLink="/admin/organizations"
          routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
          class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
        >
          <svg
            class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
            ></path>
          </svg>
          Zespoły
        </a>

        <!-- Sub-actions Tree  -->
        <div class="ml-4 pl-3 border-l-2 border-slate-700/80 space-y-1 pt-1">
          <button
            (click)="handleAddOrganization()"
            class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/20 transition-all active:scale-95"
            [class.bg-emerald-600/20]="store.isAdminOrganizationActive()"
          >
            <span class="text-green-600 text-sm font-bold">+ Dodaj zespół</span>
          </button>
        </div>
      </div>

      <!-- rooms -->
      <a
        routerLink="/admin/rooms"
        routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-900/30"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all group"
      >
        <svg
          class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m0 0v-5a2 2 0 012-2h2a2 2 0 012 2v5 border-slate-700"
          ></path>
        </svg>
        Salki
      </a>
    </nav>
  </aside>

  <!-- Main Content Viewport -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
