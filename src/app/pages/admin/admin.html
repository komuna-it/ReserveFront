<div class="min-h-screen flex flex-col md:flex-row bg-slate-900 text-slate-100">
  <!-- Mobile Top Header with Hamburger Toggle -->

  <!-- Sidebar Navigation -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Main Content Viewport -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>

@if (store.confirmMarkReservationAsAccepted() && store.selectedReservation(); as res) {
  <app-confirmation-popup
    [titleText]="'ADMIN_RESERVATIONS.CONFIRM_ACCEPT_TITLE'"
    [bodyText]="'ADMIN_RESERVATIONS.CONFIRM_ACCEPT_BODY'"
    (ok)="facade.handleConfirmAcceptReservation(res)"
    (cancel)="facade.closeModals()"
  ></app-confirmation-popup>
}

@if (store.confirmMarkReservationAsRequestCancel() && store.selectedReservation(); as res) {
  <app-confirmation-popup
    [titleText]="'ADMIN_RESERVATIONS.CONFIRM_REQUEST_CANCEL_TITLE'"
    [bodyText]="'ADMIN_RESERVATIONS.CONFIRM_REQUEST_CANCEL_BODY'"
    (ok)="facade.handleConfirmRequestCancelReservation(res)"
    (cancel)="facade.closeModals()"
  ></app-confirmation-popup>
}
