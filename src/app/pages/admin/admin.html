<div class="min-h-screen flex bg-slate-900 text-slate-100">
  <aside class="w-64 bg-slate-800 border-r border-slate-700 p-6 flex flex-col">
    <h1
      class="text-xl font-bold mb-10 text-uppercase text-center text-white border-b-2 border py-2"
    >
      Panel Admina
    </h1>

    <nav class="space-y-4">
      <a
        routerLink="/admin/reservations"
        routerLinkActive="bg-emerald-600 text-white"
        class="block px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-all"
      >
        Rezerwacje
      </a>
      <a
        routerLink="/admin/pricing"
        routerLinkActive="bg-emerald-600 text-white"
        class="block px-4 py-2 rounded-lg hover:bg-slate-700 transition-all"
      >
        Cennik
      </a>
      <a
        routerLink="/admin/organizations"
        routerLinkActive="bg-emerald-600 text-white"
        class="block px-4 py-2 rounded-lg hover:bg-slate-700 transition-all"
      >
        Zespoły
      </a>

      @if (store.isAdminOrganizationActive()) {
        <button
          class="block px-8 py-2 rounded-lg hover:bg-slate-700 transition-all"
          (click)="handleAddOrganization()"
        >
          Dodaj zespół
        </button>
      }
      <a
        routerLink="/admin/rooms"
        routerLinkActive="bg-emerald-600 text-white"
        class="block px-4 py-2 rounded-lg hover:bg-slate-700 transition-all"
      >
        Salki
      </a>
    </nav>
  </aside>
  <main class="flex-1 p-6">
    <router-outlet></router-outlet>
  </main>
</div>
