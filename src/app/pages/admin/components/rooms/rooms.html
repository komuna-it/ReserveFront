<div class="w-full overflow-x-auto">
  <table class="w-full text-left border-collapse border border-slate-600 table-fixed">
    <thead>
      <tr class="bg-slate-800 text-slate-400 text-sm border-b border-slate-600">
        <th class="py-3 px-4 font-semibold text-center border-r border-slate-600 w-48">Nr</th>
        <th class="py-3 px-4 font-semibold text-center border-r border-slate-600 w-64">Nazwa</th>
      </tr>
    </thead>
    <tbody class="text-slate-300 text-sm">
      @for (room of store.rooms(); track room.id) {
        <tr class="border-b border-slate-700 hover:bg-slate-800/50 transition-colors">
          <td class="p-3 border-r border-slate-700 font-medium text-center truncate">
            {{ room.id }}
          </td>

          <td class="p-3 border-r border-slate-700 text-center truncate">
            <span class="px-2 py-1 text-xs font-semibold">
              {{ room.name }}
            </span>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
