<div class="w-full max-w-xl rounded-2xl shadow-xl backdrop-blur-sm">
  <hr class="mb-6 border-slate-700/50" />

  @for (setting of settingsStore.settings(); track setting.key) {
    <div
      class="rounded-xl bg-slate-900/60 border border-slate-700/40 p-4 space-y-3 font-mono text-xs"
    >
      <div class="flex items-center justify-between gap-4 border-b border-slate-800/80 pb-2">
        <span class="text-slate-400 text-sm font-medium">{{ setting.key }}</span>
        <span class="text-slate-200 text-sm font-semibold truncate">{{ setting.value }}</span>
      </div>
    </div>
  }
</div>
