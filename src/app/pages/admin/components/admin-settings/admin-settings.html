<div class="w-full rounded-2xl shadow-xl backdrop-blur-sm pb-4">
  <hr class="mb-6 border-slate-700/50" />

  <form [formGroup]="form" (ngSubmit)="onSave()">
    <table class="w-full text-center border-collapse table-fixed">
      <thead>
        <tr
          class="bg-slate-900/50 border-b border-slate-700 text-slate-400 text-xs font-semibold uppercase tracking-wider"
        >
          <th class="w-1/3 border border-r border-slate-700/60 py-3 px-2 text-center">
            {{ 'SETTINGS.KEY' | transloco }}
          </th>
          <th class="w-1/3 border border-r border-slate-700/60 py-3 px-2 text-center">
            {{ 'SETTINGS.VALUE' | transloco }}
          </th>
          <th class="w-1/3 border border-r border-slate-700/60 py-3 px-2 text-center">
            {{ 'SETTINGS.NEW_VALUE' | transloco }}
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-700 text-sm">
        @for (setting of settingsStore.settings(); track setting.key) {
          <tr>
            <td class="py-4 px-2 font-mono text-xs text-center break-words">
              <span class="text-slate-400 font-medium">{{ setting.key }}</span>
            </td>

            <td class="py-4 px-2 font-mono text-xs text-center break-words">
              {{ setting.value }}
            </td>

            <td class="py-4 px-2 font-mono text-xs text-center">
              <input
                type="text"
                [formControlName]="setting.key"
                class="w-full max-w-2/3 bg-slate-700 text-white text-xs border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="mt-6 flex justify-center">
      <button
        type="submit"
        class="w-[45%] px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-white transition-all shadow-md"
      >
        {{ 'BUTTONS.SAVE' | transloco }}
      </button>
    </div>
  </form>
</div>
