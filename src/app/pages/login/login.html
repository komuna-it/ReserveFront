<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
  <div class="w-96 bg-slate-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <div>
          <label class="block mb-1">Email</label>
          <input
            type="text"
            [(ngModel)]="email"
            name="email"
            class="w-full p-2 rounded text-white border border-slate-700"
            required
          />
        </div>

        <div>
          <label class="block mb-1"> {{ 'BUTTONS.PASSWORD' | transloco }} </label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            class="w-full p-2 rounded text-white border border-slate-700"
            required
          />
        </div>
        <label class="flex items-center gap-2 mt-2 cursor-pointer text-sm text-slate-300">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500"
          />
          {{ 'BUTTONS.REMEMBER_ME' | transloco }}
        </label>
        @if (errorString()) {
          <div class="text-red-500 text-sm mt-1">
            {{ errorString() }}
          </div>
        }

        <div class="items justify-center py-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold">
            Login
          </button>

          <div class="flex justify-center py-2">
            <a
              href="/forgot-password"
              class="flex justify-center w-full border border-rounded-lg hover:bg-blue-700 p-2 text-sm"
            >
              {{ 'BUTTONS.FORGOT_PASSWORD_QUESTION' | transloco }}?
            </a>
          </div>
          <div>
            <a class="pt-2 flex justify-center text-gray-200 underline" href="/register">
              {{ 'BUTTONS.NO_ACCOUNT_REGISTER' | transloco }}
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
