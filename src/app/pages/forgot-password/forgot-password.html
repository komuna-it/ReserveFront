<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
  <div class="w-96 bg-slate-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">
      {{ 'FORGOT_PASSWORD.FORGOT_PASSWORD' | transloco }}
    </h1>

    <form (ngSubmit)="send()" class="space-y-4">
      <div>
        <label for="email" class="block mb-1 text-sm font-medium">
          {{ 'FORGOT_PASSWORD.PUT_EMAIL' | transloco }}
        </label>
        <input
          id="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          class="w-full p-2 rounded text-white bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
      </div>

      @if (errorString()) {
        <div class="text-red-400 text-sm mt-1">
          {{ errorString() }}
        </div>
      }

      @if (successString()) {
        <div class="text-emerald-400 text-sm mt-1">
          {{ successString() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading() || !email()"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed p-2 rounded font-bold transition-all"
      >
        @if (isLoading()) {
          {{ 'COMMON.LOADING' | transloco }}...
        } @else {
          {{ 'BUTTONS.SEND' | transloco }}
        }
      </button>
    </form>
  </div>
</div>
