<div class="background">
  <app-navbar></app-navbar>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

@if (store.displayErrorPopup()) {
  <app-error-popup
    [titleText]="facade.errorPopupTitle()"
    [bodyText]="facade.errorPopupBody()"
    (ok)="store.displayErrorPopup.set(false)"
  />
}

@if (store.isSuccessPopupActive()) {
  <app-success-popup
    [titleText]="facade.successPopupTitle()"
    [bodyText]="facade.successPopupBody()"
    (ok)="store.isSuccessPopupActive.set(false)"
  />
}

<app-cookie-bar></app-cookie-bar>
