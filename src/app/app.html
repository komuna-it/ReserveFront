<div class="background">
  <app-navbar></app-navbar>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

@if (viewStore.displayErrorPopup()) {
  <app-error-popup
    [titleText]="viewStore.errorPopupTitle()"
    [bodyText]="viewStore.errorPopupBody()"
    (ok)="viewStore.displayErrorPopup.set(false)"
  />
}

@if (viewStore.isSuccessPopupActive()) {
  <app-success-popup
    [titleText]="viewStore.successPopupTitle()"
    [bodyText]="viewStore.successPopupBody()"
    (ok)="viewStore.isSuccessPopupActive.set(false)"
  />
}

@if (viewStore.isConfirmationPopupActive()) {
  <app-confirmation-popup
    [titleText]="viewStore.confirmationPopupTitle()"
    [bodyText]="viewStore.confirmationPopupBody()"
    (ok)="reservationFacade.updateResStatusBasedOnConfirmationType()"
    (cancel)="viewController.handleConfirmationCancel()"
  />
}

<app-cookie-bar></app-cookie-bar>
