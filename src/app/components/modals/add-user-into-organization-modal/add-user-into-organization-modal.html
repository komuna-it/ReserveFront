<div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50">
  <div
    class="bg-slate-800 border border-slate-700 text-slate-100 px-4 py-4 rounded-2xl w-full max-w-sm shadow-2xl"
  >
    <h2 class="text-xl font-bold tracking-tight mb-4 text-emerald-400">
      {{ 'ADD_USER_INTO_ORGANIZATION.MODAL_CONFIRM_TITLE' | transloco }}
    </h2>

    <div
      class="space-y-2 text-sm text-slate-300 mb-6 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50"
    >
      <p>
        <strong>{{ 'ADD_USER_INTO_ORGANIZATION.ORG_NAME' | transloco }}:</strong>
        {{ selectedOrganization()?.name }}
      </p>
    </div>

    <div class="mb-6">
      <label
        for="userSelect"
        class="block text-xs font-bold tracking-wider uppercase text-slate-400 mb-2"
        >{{ 'ADD_USER_INTO_ORGANIZATION.SELECT_USER' | transloco }}:</label
      >
      <select
        id="userSelect"
        [ngModel]="store.organizationListSelectedUser()"
        (ngModelChange)="store.organizationListSelectedUser.set($event)"
        class="w-full bg-slate-700 text-white font-medium border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
      >
        >
        @for (user of allUsersSafe(); track user.id) {
          <option [ngValue]="user">{{ user.nick }}, {{ user.email }}</option>
        }
      </select>
    </div>

    <div class="my-2 flex gap-3 justify-end">
      <button
        (click)="cancel()"
        class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors"
      >
        {{ 'ADD_USER_INTO_ORGANIZATION.CANCEL' | transloco }}
      </button>
      <button
        (click)="confirm()"
        class="px-4 py-2 text-sm font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition-colors"
      >
        {{ 'ADD_USER_INTO_ORGANIZATION.CONFIRM' | transloco }}
      </button>
    </div>
  </div>
</div>
