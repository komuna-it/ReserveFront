<div
  class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4"
  (click)="cancel()"
>
  <div
    class="bg-slate-800 border border-slate-700 text-slate-100 p-6 rounded-2xl w-full max-w-md shadow-2xl transition-all"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
      <h2 class="text-lg font-bold tracking-tight text-emerald-400">
        {{ 'ADD_USER_INTO_ORGANIZATION.MODAL_CONFIRM_TITLE' | transloco }}
      </h2>
      <button
        type="button"
        (click)="cancel()"
        class="text-slate-400 hover:text-slate-200 transition-colors p-1 rounded-lg"
      >
        ✕
      </button>
    </div>

    <div
      class="space-y-2 text-sm text-slate-300 mb-5 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50"
    >
      <p class="flex justify-between items-center">
        <span class="text-xs text-slate-400 uppercase font-semibold tracking-wider">
          {{ 'ADD_USER_INTO_ORGANIZATION.ORG_NAME' | transloco }}:
        </span>
        <span class="font-medium text-slate-200">
          {{ store.selectedOrganization()?.name }}
        </span>
      </p>
      @if (auth.isAdmin()) {
        <p class="flex justify-between items-center">
          <span class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Rola:</span>
          <span
            class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 capitalize"
          >
            {{ 'PROFILE.' + role() | transloco }}
          </span>
        </p>
      }
    </div>
    <div class="mb-6">
      <label
        for="userSelect"
        class="block text-xs font-semibold tracking-wider uppercase text-slate-400 mb-2"
      >
        {{ 'ADD_USER_INTO_ORGANIZATION.SELECT_USER' | transloco }}:
      </label>

      <select
        id="userSelect"
        [ngModel]="store.organizationListSelectedUser()"
        (ngModelChange)="store.organizationListSelectedUser.set($event)"
        class="w-full bg-slate-900 text-slate-200 text-sm font-medium border border-slate-700 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 cursor-pointer transition-colors"
      >
        <option [ngValue]="null" disabled selected class="bg-slate-900 text-slate-500 italic">
          {{ 'COMMON.SELECT' | transloco }}
        </option>

        @for (user of usersToAddIntoOrganization(); track user.id) {
          <option [ngValue]="user" class="bg-slate-900 text-slate-200 py-1">
            @if (auth.isAdmin()) {
              {{ user.nick }} ({{ user.email }})
            } @else {
              {{ user.nick }}
            }
          </option>
        } @empty {
          <option [ngValue]="null" disabled class="bg-slate-900 text-slate-500 italic">
            Brak użytkowników do dodania
          </option>
        }
      </select>
    </div>

    <div class="flex gap-3 justify-end pt-2 border-t border-slate-700/50">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors"
      >
        {{ 'ADD_USER_INTO_ORGANIZATION.CANCEL' | transloco }}
      </button>
      <button
        type="button"
        (click)="confirm()"
        [disabled]="!store.organizationListSelectedUser()"
        class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition-all disabled:opacity-40 disabled:hover:bg-emerald-600 disabled:cursor-not-allowed"
      >
        {{ 'ADD_USER_INTO_ORGANIZATION.CONFIRM' | transloco }}
      </button>
    </div>
  </div>
</div>
