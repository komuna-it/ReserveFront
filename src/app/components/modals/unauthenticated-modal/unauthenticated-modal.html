<div
  class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50"
  (click)="facade.closeModals()"
>
  <div
    class="bg-slate-800 text-slate-100 p-6 rounded-2xl shadow-2xl border border-blue-500/40 text-center max-w-xs w-full flex flex-col items-center"
    (click)="$event.stopPropagation()"
  >
    <div
      class="w-12 h-12 text-white rounded-full flex items-center justify-center mb-3 shadow-lg border border-blue-400"
    >
      <span class="font-serif font-black text-2xl leading-none select-none">i</span>
    </div>

    <h2 class="text-lg font-bold tracking-tight mb-1 text-slate-100">
      {{ 'USER_MODALS.LOGIN_TO_CREATE_RESERVATION' | transloco }}
    </h2>

    <div class="w-full flex flex-col gap-2.5 pt-4">
      <a
        href="/login"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl font-bold transition-colors block text-center shadow-md shadow-blue-900/30"
      >
        {{ 'NAVBAR.LOGIN' | transloco }}
      </a>
      <a
        href="/register"
        class="w-full bg-slate-700/60 hover:bg-slate-700 text-slate-200 border border-slate-600/60 p-2.5 rounded-xl font-bold transition-colors block text-center"
      >
        {{ 'NAVBAR.REGISTER' | transloco }}
      </a>
    </div>
  </div>
</div>
