<!-- Modal - Add Organization -->
<div
  (click)="closeModals()"
  class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50"
>
  <div
    (click)="$event.stopPropagation()"
    class="bg-slate-800 border border-slate-700 text-slate-100 p-6 rounded-2xl w-full max-w-sm shadow-2xl flex flex-col animate-in fade-in zoom-in-95 duration-150"
  >
    <h2 class="text-lg font-bold tracking-tight mb-4 text-emerald-400 flex items-center gap-2">
      {{ 'ORGANIZATION_LIST.ADD_ORGANIZATION.TITLE' | transloco }}
    </h2>

    <div class="mb-6">
      <label
        for="bandNameInput"
        class="block text-xs font-bold tracking-wider uppercase text-slate-400 mb-2"
      >
        {{ 'ORGANIZATION_LIST.ADD_ORGANIZATION.BAND_NAME' | transloco }}:
      </label>
      <input
        #bandInput
        id="bandNameInput"
        type="text"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all"
      />
    </div>

    <div class="flex gap-3 justify-end">
      <button
        (click)="closeModals()"
        class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors"
      >
        {{ 'ORGANIZATION_LIST.ADD_ORGANIZATION.CANCEL' | transloco }}
      </button>
      <button
        (click)="createOrganization(bandInput.value)"
        class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition-all active:scale-95"
      >
        {{ 'ORGANIZATION_LIST.ADD_ORGANIZATION.ACCEPT' | transloco }}
      </button>
    </div>
  </div>
</div>
