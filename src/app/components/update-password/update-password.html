<div class="flex items-center justify-center text-white">
  <div class="w-96 p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">{{ 'COMMON.UPDATE_PASSWORD' | transloco }}</h1>

    <form (ngSubmit)="send()" class="space-y-4">
      <div>
        <div>
          <label class="block mb-1">{{ 'COMMON.OLD_PASSWORD' | transloco }}</label>
          <input
            type="password"
            [(ngModel)]="oldPassword"
            name="oldPassword"
            class="w-full p-2 rounded text-white border border-slate-700"
            required
          />
        </div>

        <div>
          <label class="block mb-1"> {{ 'COMMON.FIRST_NEW_PASSWORD' | transloco }} </label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            class="w-full p-2 rounded text-white border border-slate-700"
            required
          />
        </div>

        <div>
          <label class="block mb-1"> {{ 'COMMON.SECOND_NEW_PASSWORD' | transloco }} </label>
          <input
            type="password"
            [(ngModel)]="secondNewPassword"
            name="secondNewPassword"
            class="w-full p-2 rounded text-white border border-slate-700"
            required
          />
        </div>

        @if (errorString()) {
          <div class="text-red-500 text-sm mt-1">
            {{ errorString() | transloco }}
          </div>
        }
        @if (successString()) {
          <div class="text-green-600 text-sm mt-1">
            {{ successString() | transloco }}
          </div>
        }
        <div class="items justify-center py-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold">
            {{ 'BUTTONS.SEND' | transloco }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
