<div class="w-full overflow-x-auto">
  <table class="w-full text-left border-collapse border border-slate-600 table-fixed">
    <thead>
      <tr class="bg-slate-800 text-slate-400 text-sm border-b border-slate-600">
        <th class="py-3 px-4 font-semibold text-center border-r border-slate-600 w-48">Zespół</th>
        <th class="py-3 px-4 font-semibold text-center border-r border-slate-600 w-64">Owner</th>
        <th class="py-3 px-4 font-semibold text-center">Członkowie</th>
      </tr>
    </thead>
    <tbody class="text-slate-300 text-sm">
      @for (org of store.allOrganizations(); track org.id) {
        <tr class="border-b border-slate-700 hover:bg-slate-800/50 transition-colors">
          <td class="p-3 border-r border-slate-700 font-medium text-center truncate">
            {{ org.name }}
          </td>

          <td class="p-3 border-r border-slate-700 text-center truncate">
            <span class="px-2 py-1 text-xs font-semibold">
              {{ org.owner?.email || 'Brak właściciela' }}
            </span>
          </td>

          <td class="p-3 text-center">
            <div class="flex flex-col gap-1 justify-center items-center">
              @for (user of org.members || []; track user.id) {
                <span class="text-slate-400 text-xs">{{ user.email }}</span>
              } @empty {
                <span class="text-slate-500 text-xs italic">Brak członków</span>
              }
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
